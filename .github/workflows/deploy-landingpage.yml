name: Deploy HomeMind landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'QuangVMZu/HomeMind_LandingPage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      packages: write
    outputs:
      local-only: ${{ steps.owner_scope.outputs.active }}
      tree: ${{ steps.owner_scope.outputs.tree }}
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ${{ vars.LANDING_GHCR_IMAGE }}
      PLATFORM: ${{ vars.LANDING_IMAGE_PLATFORM }}
    steps:
      - name: Enforce completed production bootstrap
        env:
          READY: ${{ vars.LANDING_BOOTSTRAP_READY }}
          PUBLIC_URL: ${{ vars.LANDING_PUBLIC_URL }}
        run: |
          [[ "$READY" == true ]] || { echo 'BLOCKED: complete VPS audit, proxy/TLS, private pull and SSH bootstrap first.' >&2; exit 1; }
          [[ "$IMAGE" == ghcr.io/quangvmzu/homemind-landingpage ]]
          [[ "$PLATFORM" == linux/amd64 || "$PLATFORM" == linux/arm64 ]]
          [[ "$PUBLIC_URL" == https://homemind.vn ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: owner_scope
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 scripts/local-only-release.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Secret scan and release-controller rehearsal
        run: |
          bash deploy/secret-scan.sh
          if [[ "${{ steps.owner_scope.outputs.active }}" != true ]]; then python3 -m unittest discover -s tests/deploy -v; fi
          for file in deploy/*.sh; do bash -n "$file"; done
          docker run --rm -v "$PWD:/src:ro" -w /src koalaman/shellcheck:v0.11.0 deploy/*.sh
      - name: Reproducible dependency and production source checks
        id: source
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          npm run admin:contract
          if [[ "${{ steps.owner_scope.outputs.active }}" != true ]]; then npm run test:admin:unit; fi
          npm run lint
          npm run typecheck
          npm run build
          if [[ "${{ steps.owner_scope.outputs.active }}" != true ]]; then npm run test:admin:secrets; fi
          if [[ "${{ steps.owner_scope.outputs.active }}" != true ]]; then npx playwright install --with-deps chromium; fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PLATFORM == 'linux/arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing immutable commit tag
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >"$RUNNER_TEMP/manifest" 2>"$RUNNER_TEMP/manifest-error"; then
            docker pull --platform "$PLATFORM" "$IMAGE:$GITHUB_SHA"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            # An existing package with a missing tag is expected. Other errors fail.
            if ! grep -Eiq 'manifest unknown|not found|MANIFEST_UNKNOWN|NAME_UNKNOWN' "$RUNNER_TEMP/manifest-error"; then
              if gh api users/QuangVMZu/packages/container/homemind-landingpage >"$RUNNER_TEMP/package" 2>"$RUNNER_TEMP/package-error"; then
                echo 'Registry access failed for an existing package; do not overwrite it.' >&2
                exit 1
              else
                grep -q 'HTTP 404' "$RUNNER_TEMP/package-error" || { echo 'Package access check failed.' >&2; exit 1; }
                # Package API 404 alone is inconclusive; push must still enforce registry permissions.
              fi
            fi
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build production image for audited VPS
        id: image
        if: steps.existing.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=homemind-landingpage
          cache-to: type=gha,mode=max,scope=homemind-landingpage
      - name: Test the production image before publication
        if: steps.owner_scope.outputs.active != 'true'
        id: smoke
        run: bash deploy/image-smoke.sh "$IMAGE:$GITHUB_SHA" "$GITHUB_SHA" "$PLATFORM"
      - name: Publish tested image and resolve immutable registry digest
        id: publish
        env:
          EXISTING: ${{ steps.existing.outputs.found }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$EXISTING" == false ]]; then docker push "$IMAGE:$GITHUB_SHA"; fi
          docker pull --platform "$PLATFORM" "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{json .RepoDigests}}' | python3 -c 'import json,os,sys; print(next(x.split("@",1)[1] for x in json.load(sys.stdin) if x.startswith(os.environ["IMAGE"]+"@")))')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          revision=$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$revision" == "$GITHUB_SHA" ]] || { echo 'Published revision mismatch.' >&2; exit 1; }
          source=$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')
          [[ "$source" == https://github.com/QuangVMZu/HomeMind_LandingPage ]] || { echo 'Published source repository mismatch.' >&2; exit 1; }
          package=$(gh api users/QuangVMZu/packages/container/homemind-landingpage)
          visibility=$(jq -r '.visibility' <<< "$package")
          repository=$(jq -r '.repository.full_name // empty' <<< "$package")
          owner=$(jq -r '.owner.login' <<< "$package")
          name=$(jq -r '.name' <<< "$package")
          printf 'Package visibility: %s; linked repository: %s; image revision: %s\n' "$visibility" "$repository" "$revision"
          [[ "$visibility" == private ]] || { echo 'Package must be private.' >&2; exit 1; }
          [[ "${owner,,}" == quangvmzu && "$name" == homemind-landingpage ]]
          # The owner connected this package in GitHub UI. This job's REST
          # response still omitted repository; do not confuse that with an
          # unlinked package. Enforce source/revision/private owner and the
          # repo-scoped packages:read pull before any production candidate.
          [[ -z "$repository" || "$repository" == QuangVMZu/HomeMind_LandingPage ]] || { echo 'Package repository association mismatch.' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build summary
        if: always()
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_RESULT: ${{ steps.source.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          printf 'Commit: `%s`\n\nDigest: `%s`\n\nSource: %s; image/browser/failure containment: %s; private publication: %s.\n' "$GITHUB_SHA" "$DIGEST" "$SOURCE_RESULT" "$SMOKE_RESULT" "$PUBLISH_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.smoke.outcome == 'failure'
        with:
          name: image-browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    needs: build
    if: github.repository == 'QuangVMZu/HomeMind_LandingPage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      packages: read
    concurrency:
      group: homemind-landingpage-production
      cancel-in-progress: false
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Prepare verified SSH identity
        env:
          PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$VPS_DEPLOY_USER" == homemind ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ && "$VPS_SSH_PORT" -ge 1 && "$VPS_SSH_PORT" -le 65535 ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ && -n "$PRIVATE_KEY" && -n "$KNOWN_HOSTS" ]]
          install -d -m 700 "$RUNNER_TEMP/homemind-ssh"
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/homemind-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/homemind-ssh/known_hosts"
          host_name="$VPS_HOST"
          if [[ "$VPS_SSH_PORT" != 22 ]]; then host_name="[$VPS_HOST]:$VPS_SSH_PORT"; fi
          ssh-keygen -F "$host_name" -f "$RUNNER_TEMP/homemind-ssh/known_hosts" >/dev/null
      - name: Require exact root-owned no-test release pin before deployment
        if: needs.build.outputs.local-only == 'true'
        env:
          APPROVED_TREE: ${{ needs.build.outputs.tree }}
        run: |
          ssh -i "$RUNNER_TEMP/homemind-ssh/key" -p "$VPS_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/homemind-ssh/known_hosts" "$VPS_DEPLOY_USER@$VPS_HOST" owner-policy > "$RUNNER_TEMP/owner-policy.json"
          python3 -c 'import json,os,sys; p=json.load(open(sys.argv[1])); assert p["releaseId"]=="OWNER_F02_F12_LOCAL_ONLY_20261027" and p["webTree"]==os.environ["APPROVED_TREE"]' "$RUNNER_TEMP/owner-policy.json"
      - name: Reject an obsolete main release and deploy exact digest
        id: remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api repos/QuangVMZu/HomeMind_LandingPage/git/ref/heads/main --jq .object.sha)
          [[ "$head" == "$GITHUB_SHA" ]] || { echo 'Stale release: main advanced before deployment.' >&2; exit 1; }
          printf '%s\n' "$GHCR_TOKEN" | timeout 900 ssh -i "$RUNNER_TEMP/homemind-ssh/key" -p "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/homemind-ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VPS_DEPLOY_USER@$VPS_HOST" "deploy $GITHUB_SHA $DIGEST $GITHUB_RUN_NUMBER" | tee "$RUNNER_TEMP/remote-outcome"
      - name: Public HTTPS release and browser acceptance
        if: needs.build.outputs.local-only != 'true'
        id: acceptance
        env:
          SMOKE_BASE_URL: ${{ vars.LANDING_PUBLIC_URL }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          [[ "$SMOKE_BASE_URL" == https://homemind.vn ]]
          http=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code} %{redirect_url}' http://homemind.vn/)
          [[ "$http" =~ ^(301|302|307|308)\ https://homemind.vn/ ]]
          curl --fail --silent --show-error --max-time 15 https://homemind.vn/healthz > "$RUNNER_TEMP/public-release.json"
          python3 -c 'import json,os,sys; assert json.load(open(sys.argv[1]))["release"] == os.environ["EXPECTED_RELEASE"]' "$RUNNER_TEMP/public-release.json"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:smoke
          npm run test:admin:guest -- --production
      - name: Restore prior release if public acceptance fails
        id: restore
        if: failure() && steps.remote.outcome == 'success' && steps.acceptance.outcome == 'failure'
        run: |
          timeout 180 ssh -i "$RUNNER_TEMP/homemind-ssh/key" -p "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/homemind-ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VPS_DEPLOY_USER@$VPS_HOST" "rollback-if $GITHUB_SHA $DIGEST $GITHUB_RUN_NUMBER" | tee "$RUNNER_TEMP/rollback-outcome"
      - name: Deployment summary and SSH material cleanup
        if: always()
        env:
          REMOTE_RESULT: ${{ steps.remote.outcome }}
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
          RESTORE_RESULT: ${{ steps.restore.outcome }}
        run: |
          printf 'Commit: `%s`\n\nDigest: `%s`\n\nDeploy: %s; public acceptance: %s; acceptance rollback: %s.\n' "$GITHUB_SHA" "$DIGEST" "$REMOTE_RESULT" "$ACCEPTANCE_RESULT" "$RESTORE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          for file in remote-outcome rollback-outcome; do
            if [[ -f "$RUNNER_TEMP/$file" ]]; then cat "$RUNNER_TEMP/$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          if [[ -f "$RUNNER_TEMP/homemind-ssh/key" ]]; then rm -- "$RUNNER_TEMP/homemind-ssh/key"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.acceptance.outcome == 'failure'
        with:
          name: public-browser-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
